name: Generar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de Node y Capacitor
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar proyecto Android
        run: npx cap sync android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          validate-wrappers: false

      - name: Generar APK debug
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Mareas-y-Tiempo-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
